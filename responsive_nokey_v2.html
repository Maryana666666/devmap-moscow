<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>База объектов ASPACE</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:#222;background:#f4f5f7}.app{height:100vh;display:grid;grid-template-columns:470px 1fr}.side{background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;min-width:0}.head{padding:16px 18px;border-bottom:1px solid #eee}h1{margin:0 0 6px;font-size:20px}.muted{color:#777;font-size:12px}.sync{margin-top:10px;padding:8px 10px;border-radius:8px;background:#f5f7fa;font-size:12px}.toolbar,.filters{padding:9px 14px;border-bottom:1px solid #eee;display:flex;gap:7px}.toolbar button{flex:1}button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:10px;cursor:pointer;font-size:13px}button.primary{background:#222;color:#fff;border-color:#222}input,select{font:inherit;border:1px solid #ccc;border-radius:7px;padding:10px;background:#fff;width:100%}.filters{display:grid}.list{overflow:auto;padding:8px;flex:1}.card{padding:12px;border:1px solid #e5e5e5;border-radius:9px;margin-bottom:8px;cursor:pointer;background:#fff}.title{font-weight:700;font-size:13px}.meta{font-size:11px;color:#666;margin-top:5px;line-height:1.4}.badge{margin-left:5px;padding:2px 6px;border-radius:10px;background:#eee;font-size:10px}.main{position:relative;min-width:0;overflow:hidden}.map{position:absolute;inset:0;overflow:hidden;background:#e9edf0}.scene{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}.scene iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:none}.markers{position:absolute;inset:0;pointer-events:none}.markerWrap{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;z-index:5}.pin{width:32px;height:32px;border:3px solid #fff;border-radius:50% 50% 50% 0;background:#1473e6;box-shadow:0 2px 7px #0005;transform:rotate(-45deg);position:relative}.pin:after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;left:9px;top:9px}.label{position:absolute;left:16px;bottom:36px;transform:translateX(-50%);background:#fff;border-radius:6px;padding:4px 7px;font-size:11px;white-space:nowrap;box-shadow:0 1px 5px #0003;color:#222}.mapnote{position:absolute;z-index:30;left:14px;top:14px;background:#fff;padding:8px 11px;border-radius:9px;box-shadow:0 2px 10px #0002;font-size:12px}.maptools{position:absolute;z-index:40;right:14px;top:14px;display:flex;flex-direction:column;gap:5px}.maptools button{width:42px;height:42px;padding:0;font-size:22px;background:#fff;box-shadow:0 2px 8px #0002}.maptools .fit{font-size:16px}.modalbg{display:none;position:fixed;inset:0;background:#0005;z-index:2000;align-items:center;justify-content:center}.modal{background:#fff;border-radius:12px;padding:17px;width:min(820px,calc(100% - 24px));max-height:92vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px;font-size:11px;color:#666}.full{grid-column:1/-1}.urlbox{display:flex;gap:7px}.urlbox input{flex:1}.urlbox a{padding:8px 10px;border:1px solid #ccc;border-radius:7px;text-decoration:none;color:#222;background:#f7f7f7}.empty{padding:18px;text-align:center;color:#777;font-size:12px}@media(max-width:900px){.app{display:flex;flex-direction:column;height:auto;min-height:100vh}.main{order:1;height:48vh;min-height:320px}.side{order:2}.head{padding:14px 16px}.head h1{font-size:23px}.toolbar button{min-height:44px}.filters{padding:10px 14px;gap:9px}.filters input,.filters select{min-height:46px;font-size:16px}.list{overflow:visible;padding:10px 14px 40px}.card{padding:15px;margin-bottom:10px}.title{font-size:16px}.meta{font-size:13px}.mapnote{left:10px;top:10px;font-size:11px}.maptools{right:10px;top:10px}.modal{width:calc(100% - 16px);max-height:88vh}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="app"><aside class="side"><div class="head"><h1>База объектов ASPACE</h1><div class="muted">Одна общая версия для коллег. Данные — Google Таблица, карта — Яндекс.</div><div class="sync" id="sync">Загружаю данные…</div></div><div class="toolbar"><button class="primary" onclick="loadData(true)">↻ Обновить</button><button onclick="openSheet()">↗ Открыть таблицу</button></div><div class="filters"><input id="q" placeholder="Поиск: проект, адрес, метро, агентство…" oninput="render()"><select id="status" onchange="render()"><option value="">Все статусы</option></select><select id="district" onchange="render()"><option value="">Все районы</option></select><select id="decision" onchange="render()"><option value="">Все решения</option></select></div><div id="list" class="list"></div></aside><main class="main"><div id="map" class="map"></div><div class="mapnote">Нажмите на синюю метку — откроется карточка проекта</div><div class="maptools"><button onclick="zoomMap(1)">+</button><button onclick="zoomMap(-1)">−</button><button class="fit" onclick="fitMap()">⌖</button></div></main></div><div id="modal" class="modalbg"><div class="modal"><h2 id="mt">Объект</h2><div id="form" class="grid"></div><div style="text-align:right;margin-top:14px"><button onclick="$('modal').style.display='none'">Закрыть</button></div></div></div><script>const SHEET_URL='https://docs.google.com/spreadsheets/d/1Bv-VRTjRVrIiXGXC9AJR4JqS1y4VQECxD2BZEpDRUis/edit?usp=sharing';const CSV_URLS=['https://docs.google.com/spreadsheets/d/1Bv-VRTjRVrIiXGXC9AJR4JqS1y4VQECxD2BZEpDRUis/gviz/tq?tqx=out:csv&gid=0','https://docs.google.com/spreadsheets/d/e/2PACX-1vTB07y0UlTuKbTTIEFXMblZx_GVEiXKrVreOVq3n83nX4cpzxFnjNU64T2KSwQ3iQGUr_Y2-2aEFJRY/pub?output=csv'];let data=[],cols=[],centerLon=37.618423,centerLat=55.751244,viewZoom=10,scale=1,panX=0,panY=0;const $=id=>document.getElementById(id);function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function col(){for(const w of arguments){const f=cols.find(c=>String(c).trim().toLowerCase()===String(w).toLowerCase());if(f)return f}return ''}function val(p,c){return c?(p[c]||''):''}const nameC=()=>col('Название проекта','Проект','Название'),statusC=()=>col('Статус'),districtC=()=>col('Район'),decisionC=()=>col('Решение'),addrC=()=>col('Адрес'),latC=()=>col('Широта','Latitude','lat'),lonC=()=>col('Долгота','Longitude','lon'),metroC=()=>col('Метро');function parseCSV(t){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<t.length;i++){const ch=t[i];if(ch==='"'){if(quoted&&t[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=ch}if(cell!==''||row.length){row.push(cell);if(row.some(x=>x!==''))rows.push(row)}if(!rows.length)return[];const h=rows[0];return rows.slice(1).map(r=>{const p={};h.forEach((x,i)=>p[x]=r[i]??'');return p}).filter(p=>Object.values(p).some(Boolean))}async function fetchText(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const res=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store',mode:'cors',signal:c.signal});if(!res.ok)throw new Error('HTTP '+res.status);return await res.text()}finally{clearTimeout(t)}}function renderFilters(){[['status',statusC(),'Все статусы'],['district',districtC(),'Все районы'],['decision',decisionC(),'Все решения']].forEach(([id,c,f])=>{const el=$(id),old=el.value,vs=[...new Set(data.map(p=>String(val(p,c)).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));el.innerHTML='<option value="">'+f+'</option>'+vs.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(vs.includes(old))el.value=old})}function filteredRows(){const q=$('q').value.trim().toLowerCase(),s=$('status').value,d=$('district').value,r=$('decision').value;return data.map((p,i)=>({p,i})).filter(({p})=>{const all=cols.map(c=>val(p,c)).join(' ').toLowerCase();return(!q||all.includes(q))&&(!s||val(p,statusC())===s)&&(!d||val(p,districtC())===d)&&(!r||val(p,decisionC())===r)})}function points(){return filteredRows().map(({p,i})=>{const lat=parseFloat(String(val(p,latC())).replace(',','.')),lon=parseFloat(String(val(p,lonC())).replace(',','.'));return Number.isFinite(lat)&&Number.isFinite(lon)?{lat,lon,p,i}:null}).filter(Boolean)}function baseXY(lat,lon){const w=$('map').clientWidth,h=$('map').clientHeight,sc=256*Math.pow(2,10),X=(lon+180)/360*sc,Y=(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*sc,CX=(centerLon+180)/360*sc,CY=(1-Math.log(Math.tan(centerLat*Math.PI/180)+1/Math.cos(centerLat*Math.PI/180))/Math.PI)/2*sc;return{x:w/2+X-CX,y:h/2+Y-CY}}function applyTransform(){const s=$('scene');if(s)s.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')'}function draw(){const rs=points(),map=$('map');map.innerHTML='<div id="scene" class="scene"><iframe title="Яндекс Карты" src="https://yandex.ru/map-widget/v1/?ll='+encodeURIComponent(centerLon+','+centerLat)+'&z=10&lang=ru_RU&l=map" allowfullscreen loading="eager"></iframe><div class="markers"></div></div>';const layer=map.querySelector('.markers');rs.forEach(({lat,lon,p,i})=>{const q=baseXY(lat,lon),m=document.createElement('div');m.className='markerWrap';m.style.left=q.x+'px';m.style.top=q.y+'px';m.innerHTML='<div class="label">'+esc(val(p,nameC())||'Проект')+'</div><div class="pin"></div>';m.onclick=()=>openProject(i);layer.appendChild(m)});applyTransform()}function fitMap(){const a=points();panX=0;panY=0;if(!a.length){centerLon=37.618423;centerLat=55.751244;viewZoom=10;scale=1;draw();return}let minLon=a[0].lon,maxLon=a[0].lon,minLat=a[0].lat,maxLat=a[0].lat;a.forEach(q=>{minLon=Math.min(minLon,q.lon);maxLon=Math.max(maxLon,q.lon);minLat=Math.min(minLat,q.lat);maxLat=Math.max(maxLat,q.lat)});centerLon=(minLon+maxLon)/2;centerLat=(minLat+maxLat)/2;const span=Math.max(maxLon-minLon,(maxLat-minLat)*1.6,0.03);viewZoom=Math.max(9,Math.min(14,Math.floor(Math.log2(360/(span*2)))));scale=Math.pow(2,viewZoom-10);draw()}function zoomMap(d){viewZoom=Math.max(8,Math.min(16,viewZoom+d));scale=Math.pow(2,viewZoom-10);applyTransform()}function render(){renderFilters();const rs=filteredRows();$('list').innerHTML=rs.length?rs.map(({p,i})=>'<div class="card" onclick="openProject('+i+')"><div class="title">'+esc(val(p,nameC())||'Без названия')+(val(p,statusC())?'<span class="badge">'+esc(val(p,statusC()))+'</span>':'')+'</div><div class="meta">'+esc(val(p,addrC()))+(val(p,metroC())?' · м. '+esc(val(p,metroC())):'')+'</div></div>').join(''):'<div class="empty">Объектов не найдено</div>';fitMap()}function openProject(i){const p=data[i];if(!p)return;$('mt').textContent=val(p,nameC())||'Объект';$('form').innerHTML=cols.map(c=>{const v=val(p,c),u=/^https?:\/\//i.test(String(v));const control=u?'<div class="urlbox"><input value="'+esc(v)+'" readonly><a href="'+esc(v)+'" target="_blank" rel="noopener">Открыть</a></div>':'<input value="'+esc(v)+'" readonly>';return'<label class="field '+(/адрес|ссылка|комментар|следующее действие/i.test(c)?'full':'')+'">'+esc(c)+control+'</label>'}).join('');$('modal').style.display='flex'}function openSheet(){window.open(SHEET_URL,'_blank')}async function loadData(manual){$('sync').textContent='Обновляю данные…';let last='';for(const url of CSV_URLS){try{const rows=parseCSV(await fetchText(url));if(!rows.length)throw new Error('таблица пуста');cols=Object.keys(rows[0]);data=rows;render();$('sync').textContent='✓ Обновлено: '+new Date().toLocaleTimeString('ru-RU')+' · объектов: '+data.length;return}catch(e){last=e.message||'ошибка'}}$('sync').textContent='Ошибка загрузки данных: '+last;if(manual)alert('Не удалось загрузить данные Google Таблицы.')}loadData(false);setInterval(()=>loadData(false),60000);</script></body></html>
