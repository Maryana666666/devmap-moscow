<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>База объектов ASPACE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Arial,sans-serif;color:#222;background:#f4f5f7}body{min-height:100vh}.app{min-height:100vh;display:grid;grid-template-columns:470px 1fr}.side{background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;min-height:100vh}.head{padding:16px 18px;border-bottom:1px solid #eee}h1{margin:0 0 6px;font-size:20px}.muted{color:#777;font-size:12px}.sync{margin-top:10px;padding:8px 10px;border-radius:8px;background:#f5f7fa;font-size:12px}.toolbar,.filters{padding:9px 14px;border-bottom:1px solid #eee;display:flex;gap:7px;flex-wrap:wrap}.toolbar button{flex:1}button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:10px;cursor:pointer;font-size:13px}button.primary{background:#222;color:#fff;border-color:#222}input,select{font:inherit;border:1px solid #ccc;border-radius:7px;padding:10px;background:#fff;width:100%}.filters{display:grid}.list{overflow:auto;padding:8px;flex:1}.card{padding:12px;border:1px solid #e5e5e5;border-radius:9px;margin-bottom:8px;cursor:pointer;background:#fff}.title{font-weight:700;font-size:13px}.meta{font-size:11px;color:#666;margin-top:5px;line-height:1.4}.badge{margin-left:5px;padding:2px 6px;border-radius:10px;background:#eee;font-size:10px}.main{position:relative;min-width:0;background:#e5e7eb}.map{position:absolute;inset:0}.mapnote{position:absolute;z-index:10;left:14px;top:14px;background:#fff;padding:8px 11px;border-radius:9px;box-shadow:0 2px 10px #0002;font-size:12px}.modalbg{display:none;position:fixed;inset:0;background:#0005;z-index:2000;align-items:center;justify-content:center}.modal{background:#fff;border-radius:12px;padding:17px;width:min(820px,calc(100% - 24px));max-height:92vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px;font-size:11px;color:#666}.full{grid-column:1/-1}.urlbox{display:flex;gap:7px}.urlbox input{flex:1}.urlbox a{padding:8px 10px;border:1px solid #ccc;border-radius:7px;text-decoration:none;color:#222;background:#f7f7f7}.empty{padding:18px;text-align:center;color:#777;font-size:12px}.mapError{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:#555;background:#eef0f3}.mapErrorBox{max-width:520px;background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 14px #0002}.marker{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 8px #0005;cursor:pointer}.marker>span{display:block;width:6px;height:6px;border-radius:50%;background:#fff;margin:3px}.status-interest{background:#e67e22}.status-study{background:#3498db}.status-new{background:#27ae60}.status-hold{background:#9b59b6}.status-no{background:#777}
@media(max-width:900px){html,body{overflow-x:hidden}.app{display:flex;flex-direction:column;min-height:100vh}.main{order:1;height:34vh;min-height:260px;max-height:360px;flex:none}.side{order:2;min-height:0;display:block;border-right:0}.head{padding:14px 16px}.head h1{font-size:23px}.muted{font-size:12px;line-height:1.35}.sync{font-size:13px}.toolbar{padding:10px 14px}.toolbar button{min-height:44px;font-size:15px}.filters{padding:10px 14px;gap:9px}.filters input,.filters select{min-height:46px;font-size:16px}.list{overflow:visible;padding:10px 14px 40px;display:block}.card{padding:15px;margin-bottom:10px;min-height:74px}.title{font-size:16px;line-height:1.3}.meta{font-size:13px;margin-top:6px}.mapnote{left:10px;top:10px;font-size:11px;padding:7px 9px}.modal{width:calc(100% - 16px);max-height:88vh;padding:14px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:420px){.main{height:31vh;min-height:245px}.head h1{font-size:22px}.toolbar button{font-size:14px}.list{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="head"><h1>База объектов ASPACE</h1><div class="muted">Одна общая версия для коллег. Данные — Google Таблица, карта — Яндекс.</div><div class="sync" id="sync">Загружаю данные…</div></div><div class="toolbar"><button class="primary" onclick="loadData(true)">↻ Обновить</button><button onclick="openSheet()">↗ Открыть таблицу</button></div><div class="filters"><input id="q" placeholder="Поиск: проект, адрес, метро, агентство…" oninput="render()"><select id="status" onchange="render()"><option value="">Все статусы</option></select><select id="district" onchange="render()"><option value="">Все районы</option></select><select id="decision" onchange="render()"><option value="">Все решения</option></select></div><div id="list" class="list"></div></aside><main class="main"><div id="map" class="map"></div><div class="mapnote">Яндекс Карты · нажмите на точку для карточки</div></main></div>
<div id="modal" class="modalbg"><div class="modal"><h2 id="mt">Объект</h2><div id="form" class="grid"></div><div style="text-align:right;margin-top:14px"><button onclick="document.getElementById('modal').style.display='none'">Закрыть</button></div></div></div>
<script>
const SHEET_URL='https://docs.google.com/spreadsheets/d/1Bv-VRTjRVrIiXGXC9AJR4JqS1y4VQECxD2BZEpDRUis/edit?usp=sharing';
const CSV_URLS=['https://docs.google.com/spreadsheets/d/1Bv-VRTjRVrIiXGXC9AJR4JqS1y4VQECxD2BZEpDRUis/gviz/tq?tqx=out:csv&gid=0','https://docs.google.com/spreadsheets/d/e/2PACX-1vTB07y0UlTuKbTTIEFXMblZx_GVEiXKrVreOVq3n83nX4cpzxFnjNU64T2KSwQ3iQGUr_Y2-2aEFJRY/pub?output=csv'];
let data=[],cols=[],map=null,markers=[];const $=id=>document.getElementById(id);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function col(){for(const w of arguments){const f=cols.find(c=>String(c).trim().toLowerCase()===String(w).toLowerCase());if(f)return f}return ''}function val(p,c){return c?(p[c]||''):''}
const nameC=()=>col('Название проекта','Проект','Название'),statusC=()=>col('Статус'),districtC=()=>col('Район'),decisionC=()=>col('Решение'),addrC=()=>col('Адрес'),latC=()=>col('Широта','Latitude','lat'),lonC=()=>col('Долгота','Longitude','lon'),metroC=()=>col('Метро');
function parseCSV(t){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<t.length;i++){const ch=t[i];if(ch==='"'){if(quoted&&t[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x!==''))rows.push(row);if(!rows.length)return[];const h=rows[0];return rows.slice(1).map(r=>{const p={};h.forEach((x,i)=>p[x]=r[i]??'');return p})}
async function fetchText(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const res=await fetch(url+(url.includes('?')?'&':'?')+'_= '+Date.now(),{cache:'no-store',mode:'cors',signal:c.signal});if(!res.ok)throw new Error('HTTP '+res.status);return await res.text()}finally{clearTimeout(t)}}
async function loadData(manual){$('sync').textContent='Обновляю данные…';let last='';for(const url of CSV_URLS){try{const rows=parseCSV(await fetchText(url));if(!rows.length)throw new Error('таблица пуста');cols=Object.keys(rows[0]);data=rows;render();$('sync').textContent='✓ Обновлено: '+new Date().toLocaleTimeString('ru-RU')+' · объектов: '+data.length;return}catch(e){last=e.message||'ошибка'}}$('sync').textContent='Ошибка загрузки данных: '+last;if(manual)alert('Не удалось загрузить данные Google Таблицы. Проверьте доступ к таблице.');}
function renderFilters(){[['status',statusC(),'Все статусы'],['district',districtC(),'Все районы'],['decision',decisionC(),'Все решения']].forEach(([id,c,f])=>{const el=$(id),old=el.value,vs=[...new Set(data.map(p=>String(val(p,c)).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));el.innerHTML='<option value="">'+f+'</option>'+vs.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(vs.includes(old))el.value=old})}
function filteredRows(){const q=$('q').value.trim().toLowerCase(),s=$('status').value,d=$('district').value,r=$('decision').value;return data.map((p,i)=>({p,i})).filter(({p})=>{const all=cols.map(c=>val(p,c)).join(' ').toLowerCase();return(!q||all.includes(q))&&(!s||val(p,statusC())===s)&&(!d||val(p,districtC())===d)&&(!r||val(p,decisionC())===r)})}
function render(){renderFilters();const rs=filteredRows();$('list').innerHTML=rs.length?rs.map(({p,i})=>'<div class="card" onclick="openProject('+i+');focusProject('+i+')"><div class="title">'+esc(val(p,nameC())||'Без названия')+(val(p,statusC())?'<span class="badge">'+esc(val(p,statusC()))+'</span>':'')+'</div><div class="meta">'+esc(val(p,addrC()))+(val(p,metroC())?' · м. '+esc(val(p,metroC())):'')+'</div></div>').join(''):'<div class="empty">Объектов не найдено</div>';renderMap()}
function markerClass(s){s=String(s).toLowerCase();if(s.includes('интерес'))return'status-interest';if(s.includes('изуч'))return'status-study';if(s.includes('нов'))return'status-new';if(s.includes('отлож'))return'status-hold';return'status-no'}
function renderMap(){if(!map)return;markers.forEach(m=>{try{map.removeChild(m)}catch(e){}});markers=[];const pts=[];filteredRows().forEach(({p,i})=>{const lat=parseFloat(String(val(p,latC())).replace(',','.')),lon=parseFloat(String(val(p,lonC())).replace(',','.'));if(!Number.isFinite(lat)||!Number.isFinite(lon))return;const el=document.createElement('div');el.className='marker '+markerClass(val(p,statusC()));el.innerHTML='<span></span>';el.onclick=e=>{e.stopPropagation();openProject(i);map.setLocation({center:[lon,lat],zoom:14,duration:250})};const m=new ymaps3.YMapMarker({coordinates:[lon,lat],zIndex:100},el);map.addChild(m);markers.push(m);pts.push([lon,lat])});if(pts.length===1)map.setLocation({center:pts[0],zoom:13});else if(pts.length>1){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);map.setLocation({bounds:[[Math.min(...xs),Math.min(...ys)],[Math.max(...xs),Math.max(...ys)]],duration:250})}else map.setLocation({center:[37.618423,55.751244],zoom:10})}
function focusProject(i){const p=data[i];if(!p||!map)return;const lat=parseFloat(String(val(p,latC())).replace(',','.')),lon=parseFloat(String(val(p,lonC())).replace(',','.'));if(Number.isFinite(lat)&&Number.isFinite(lon))map.setLocation({center:[lon,lat],zoom:14,duration:250})}
function openProject(i){const p=data[i];if(!p)return;$('mt').textContent=val(p,nameC())||'Объект';$('form').innerHTML=cols.map(c=>{const v=val(p,c),u=/^https?:\/\//i.test(String(v));const control=u?'<div class="urlbox"><input value="'+esc(v)+'" readonly><a href="'+esc(v)+'" target="_blank" rel="noopener">Открыть</a></div>':'<input value="'+esc(v)+'" readonly>';return'<label class="field '+(/адрес|ссылка|комментар|следующее действие/i.test(c)?'full':'')+'">'+esc(c)+control+'</label>'}).join('');$('modal').style.display='flex'}
function openSheet(){window.open(SHEET_URL,'_blank')}
function mapError(msg){$('map').innerHTML='<div class="mapError"><div class="mapErrorBox"><b>Яндекс Карта не загрузилась</b><div style="margin:10px 0 14px;line-height:1.5">'+esc(msg)+'</div><button onclick="initMap()">Повторить</button></div></div>'}
function initMap(){if(map)return;const key=localStorage.getItem('dev_yandex_key_v3')||'';if(!key){mapError('В этом браузере не найден ключ JavaScript API Яндекс.');return}if(document.querySelector('script[data-yandex-map]'))return;const s=document.createElement('script');s.dataset.yandexMap='1';s.src='https://api-maps.yandex.ru/v3/?apikey='+encodeURIComponent(key)+'&lang=ru_RU';s.onload=()=>{if(!window.ymaps3){mapError('API Яндекс загрузилось, но ymaps3 не найден.');return}Promise.race([ymaps3.ready,new Promise((_,r)=>setTimeout(()=>r(new Error('Яндекс Карты не ответили за 10 секунд. Проверьте VPN/сеть.')),10000))]).then(()=>{map=new ymaps3.YMap($('map'),{location:{center:[37.618423,55.751244],zoom:10}},[new ymaps3.YMapDefaultSchemeLayer({}),new ymaps3.YMapDefaultFeaturesLayer({})]);renderMap()}).catch(e=>mapError(e.message||'Ошибка карты'))};s.onerror=()=>mapError('Не удалось загрузить API Яндекс. Проверьте VPN/сеть и ограничения ключа.');document.head.appendChild(s)}
loadData(false);initMap();setInterval(()=>loadData(false),60000);
</script>
</body></html>
