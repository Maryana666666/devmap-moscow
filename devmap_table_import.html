<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Девелопмент Москва — карта</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f4f5f7}.app{height:100vh;display:grid;grid-template-columns:470px 1fr}.side{background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}.head{padding:15px 18px;border-bottom:1px solid #eee}h1{margin:0 0 5px;font-size:20px}.muted,.small{color:#777;font-size:12px;line-height:1.4}.toolbar,.filters{padding:9px 14px;border-bottom:1px solid #eee;display:flex;gap:7px;flex-wrap:wrap}.filters{display:grid}.toolbar button{flex:1}button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px}button.primary{background:#222;color:#fff;border-color:#222}input,select,textarea{font:inherit;border:1px solid #ccc;border-radius:7px;padding:8px;background:#fff;width:100%}.list{overflow:auto;padding:8px}.card{padding:11px;border:1px solid #e5e5e5;border-radius:9px;margin-bottom:7px;cursor:pointer}.title{font-weight:700;font-size:13px}.meta{font-size:11px;color:#666;margin-top:4px;line-height:1.4}.badge{margin-left:5px;padding:2px 6px;border-radius:10px;background:#eee;font-size:10px}.map{position:relative}#map{width:100%;height:100%}.maphelp{position:absolute;z-index:5;left:14px;top:14px;background:#fff;padding:9px 11px;border-radius:8px;box-shadow:0 2px 12px #0002;font-size:12px;max-width:390px}.modalbg{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:center;justify-content:center}.modal{background:#fff;border-radius:12px;padding:17px;width:min(820px,calc(100% - 24px));max-height:92vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px;font-size:11px;color:#666}.full{grid-column:1/-1}.actions{display:flex;justify-content:space-between;margin-top:14px}.right{display:flex;gap:7px}.urlbox{display:flex;gap:7px}.urlbox input{flex:1}.urlbox a{padding:8px 10px;border:1px solid #ccc;border-radius:7px;text-decoration:none;color:#222;white-space:nowrap;background:#f7f7f7}.marker{width:18px;height:18px;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 6px #0006;cursor:pointer}.interest{background:#d32f2f}.study{background:#f0b400}.delay{background:#7b61a8}.reject{background:#777}.other{background:#1976d2}.empty{padding:18px;text-align:center;color:#777;font-size:12px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:56vh}.map{height:44vh}}
</style></head><body><div class="app"><aside class="side"><div class="head"><h1>База объектов девелопмента</h1><div class="muted">Яндекс Таблица → скачать XLSX → нажать «Обновить из Excel». Карта использует загруженный файл.</div></div><div class="toolbar"><button class="primary" onclick="file.click()">↻ Обновить из Excel</button><button onclick="newProject()">＋ Новый объект</button><button onclick="openBase()">↗ Яндекс Таблица</button><button onclick="settings.style.display='flex';key.value=localStorage.getItem('dev_yandex_key_v3')||''">⚙ Ключ</button><input id="file" type="file" accept=".xlsx,.xls,.csv" hidden onchange="importExcel(event)"></div><div class="filters"><input id="q" placeholder="Поиск: проект, адрес, метро, агентство…" oninput="render()"><select id="status" onchange="render()"><option value="">Все статусы</option></select><select id="district" onchange="render()"><option value="">Все районы</option></select><select id="decision" onchange="render()"><option value="">Все решения</option></select></div><div id="list" class="list"></div></aside><main class="map"><div id="map"></div><div id="maphelp" class="maphelp">Карта загружается…</div></main></div>
<div id="modal" class="modalbg"><div class="modal"><h2 id="mt" style="margin:0 0 12px">Объект</h2><div id="form" class="grid"></div><div class="actions"><button onclick="del()" style="color:#b42318">Удалить</button><div class="right"><button onclick="modal.style.display='none'">Отмена</button><button class="primary" onclick="save()">Сохранить</button></div></div></div></div><div id="settings" class="modalbg"><div class="modal"><h2>Ключ Яндекс JS API</h2><div class="small">Ключ сохраняется только в браузере. Если на этой странице карта уже работала, обычно вводить его заново не надо.</div><label class="field" style="margin-top:12px">Ключ<input id="key" type="password"></label><div class="actions"><span></span><div class="right"><button onclick="settings.style.display='none'">Отмена</button><button class="primary" onclick="saveKey()">Сохранить</button></div></div></div></div>
<script>
const BASE='https://disk.360.yandex.ru/i/9lVnEpyq1YIWTw',DS='dev_projects_import_v3',CS='dev_columns_import_v3',KS='dev_yandex_key_v3';let data=[],cols=[],map=null,marks=[],current=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const col=(...a)=>a.map(x=>cols.find(c=>String(c).trim().toLowerCase()==x.toLowerCase())).find(Boolean)||'';const nameC=()=>col('Название проекта','Проект','Название'),statusC=()=>col('Статус'),districtC=()=>col('Район'),decisionC=()=>col('Решение'),latC=()=>col('Широта','lat','latitude'),lonC=()=>col('Долгота','lon','lng','longitude'),addrC=()=>col('Адрес'),idC=()=>col('ID','Id','id');const val=(p,c)=>c?(p[c]??''):'';const num=v=>{let n=Number(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:null};
function saveLocal(){localStorage.setItem(DS,JSON.stringify(data));localStorage.setItem(CS,JSON.stringify(cols))}function loadLocal(){try{data=JSON.parse(localStorage.getItem(DS)||'[]')||[];cols=JSON.parse(localStorage.getItem(CS)||'[]')||[]}catch(e){data=[];cols=[]}}
function sid(p,i){return String(idC()?val(p,idC()):'row_'+i)}function sc(s){s=String(s||'').toLowerCase();return s.includes('отказ')?'reject':s.includes('интерес')?'interest':s.includes('изуч')?'study':s.includes('отлож')?'delay':'other'}
function renderFilters(){[['status',statusC(),'Все статусы'],['district',districtC(),'Все районы'],['decision',decisionC(),'Все решения']].forEach(([id,c,first])=>{let e=$(id),old=e.value,vs=[...new Set(data.map(p=>String(val(p,c)).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));e.innerHTML='<option value="">'+first+'</option>'+vs.map(v=>'<option>'+esc(v)+'</option>').join('');if(vs.includes(old))e.value=old})}
function rows(){let q=$('q').value.toLowerCase(),s=$('status').value,d=$('district').value,r=$('decision').value;return data.map((p,i)=>({p,i})).filter(({p})=>(!q||cols.map(c=>val(p,c)).join(' ').toLowerCase().includes(q))&&(!s||val(p,statusC())==s)&&(!d||val(p,districtC())==d)&&(!r||val(p,decisionC())==r))}
function render(){renderFilters();let rs=rows();$('list').innerHTML=rs.length?rs.map(({p,i})=>`<div class="card" onclick="openProject('${esc(sid(p,i))}')"><div class="title">${esc(val(p,nameC())||'Без названия')}${val(p,statusC())?'<span class="badge">'+esc(val(p,statusC()))+'</span>':''}</div><div class="meta">${esc(val(p,addrC()))}${val(p,col('Метро'))?' · м. '+esc(val(p,col('Метро'))):''}</div></div>`).join(''):'<div class="empty">Объектов не найдено</div>';renderMap()}
function openProject(id){let i=data.findIndex((p,j)=>sid(p,j)==id);if(i<0)return;current=i;let p=data[i];$('mt').textContent=val(p,nameC())||'Объект';$('form').innerHTML=cols.map(c=>{let v=val(p,c),full=/адрес|ссылка|комментар|следующее действие/i.test(c),url=/^https?:\/\//i.test(String(v)),ctl=url?`<div class="urlbox"><input data-c="${esc(c)}" value="${esc(v)}"><a href="${esc(v)}" target="_blank" rel="noopener">Открыть</a></div>`:/комментар|следующее действие/i.test(c)?`<textarea data-c="${esc(c)}" rows="3">${esc(v)}</textarea>`:`<input data-c="${esc(c)}" value="${esc(v)}">`;return `<label class="field ${full?'full':''}">${esc(c)}${ctl}</label>`}).join('');$('modal').style.display='flex';let la=num(val(p,latC())),lo=num(val(p,lonC()));if(map&&la!==null&&lo!==null)map.setLocation({center:[lo,la],zoom:14,duration:300})}
function newProject(){let p={};cols.forEach(c=>p[c]='');if(idC()){let ns=data.map(x=>num(val(x,idC()))).filter(x=>x!==null);p[idC()]=ns.length?Math.max(...ns)+1:1}data.push(p);saveLocal();render();openProject(sid(p,data.length-1))}
function save(){if(current===null)return;document.querySelectorAll('#form [data-c]').forEach(e=>data[current][e.dataset.c]=e.value);saveLocal();$('modal').style.display='none';render()}function del(){if(current===null||!confirm('Удалить объект из карты?'))return;data.splice(current,1);current=null;saveLocal();$('modal').style.display='none';render()}function openBase(){window.open(BASE,'_blank')}
function saveKey(){let k=$('key').value.trim();k?localStorage.setItem(KS,k):localStorage.removeItem(KS);$('settings').style.display='none';loadMap()}
async function importExcel(e){let f=e.target.files?.[0];if(!f)return;try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array',raw:false}),ws=wb.Sheets[wb.SheetNames[0]],rs=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});if(!rs.length)throw Error('В первом листе нет строк.');cols=[];rs.forEach(r=>Object.keys(r).forEach(c=>{if(!cols.includes(c))cols.push(c)}));data=rs.map(r=>{let p={};cols.forEach(c=>p[c]=r[c]??'');return p});saveLocal();render();$('maphelp').textContent='Загружено из Excel: '+data.length+' объектов.';alert('Готово. Загружено '+data.length+' объектов из «'+f.name+'».')}catch(x){alert('Не удалось загрузить Excel: '+x.message)}e.target.value=''}
function clearMarks(){marks.forEach(m=>map.removeChild(m));marks=[]}function renderMap(){if(!map||!window.YMapMarker)return;clearMarks();rows().forEach(({p,i})=>{let la=num(val(p,latC())),lo=num(val(p,lonC()));if(la===null||lo===null)return;let el=document.createElement('div');el.className='marker '+sc(val(p,statusC()));el.title=val(p,nameC())||'Объект';el.onclick=()=>openProject(sid(p,i));let m=new YMapMarker({coordinates:[lo,la]},el);map.addChild(m);marks.push(m)})}
async function loadMap(){let k=localStorage.getItem(KS)||'';if(!k){$('maphelp').innerHTML='Нажмите <b>⚙ Ключ</b> и вставьте ваш ключ Яндекс JS API.';return}let old=document.querySelector('script[data-ymaps]');if(old)old.remove();let s=document.createElement('script');s.dataset.ymaps='1';s.src='https://api-maps.yandex.ru/v3/?apikey='+encodeURIComponent(k)+'&lang=ru_RU';s.onload=async()=>{try{await ymaps3.ready;({YMap,YMapDefaultSchemeLayer,YMapDefaultFeaturesLayer,YMapMarker}=ymaps3);map=new YMap($('map'),{location:{center:[37.6176,55.7558],zoom:9}});map.addChild(new YMapDefaultSchemeLayer({}));map.addChild(new YMapDefaultFeaturesLayer({}));window.YMapMarker=YMapMarker;renderMap();$('maphelp').textContent='Карта готова. Объектов: '+data.length+'.'}catch(e){$('maphelp').textContent='Ошибка карты: '+e.message}};s.onerror=()=>{$('maphelp').textContent='Не удалось загрузить Яндекс API. Проверьте ключ и ограничения домена.'};document.head.appendChild(s)}
async function init(){loadLocal();if(!data.length){try{let r=await fetch('data.json',{cache:'no-store'});if(r.ok){data=await r.json();if(data.length){cols=Object.keys(data[0]);saveLocal()}}}catch(e){}}if(!cols.length&&data.length)cols=Object.keys(data[0]);render();loadMap()}init();
</script></body></html>
