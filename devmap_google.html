<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Девелопмент Москва — общая база</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f4f5f7}.app{min-height:100vh;display:grid;grid-template-columns:470px 1fr}.side{background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;min-height:100vh;z-index:2}.head{padding:16px 18px;border-bottom:1px solid #eee}h1{margin:0 0 6px;font-size:20px}.muted,.small{color:#777;font-size:12px;line-height:1.45}.sync{margin-top:10px;padding:8px 10px;border-radius:8px;background:#f5f7fa;font-size:12px}.toolbar,.filters{padding:9px 14px;border-bottom:1px solid #eee;display:flex;gap:7px;flex-wrap:wrap}.toolbar button{flex:1}button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px}button.primary{background:#222;color:#fff;border-color:#222}input,select,textarea{font:inherit;border:1px solid #ccc;border-radius:7px;padding:8px;background:#fff;width:100%}.filters{display:grid}.list{overflow:auto;padding:8px;flex:1}.card{padding:11px;border:1px solid #e5e5e5;border-radius:9px;margin-bottom:7px;cursor:pointer;background:#fff}.card:hover{background:#fafafa}.title{font-weight:700;font-size:13px}.meta{font-size:11px;color:#666;margin-top:4px;line-height:1.4}.badge{margin-left:5px;padding:2px 6px;border-radius:10px;background:#eee;font-size:10px}.main{position:relative;min-width:0;background:#e5e7eb}.map{position:absolute;inset:0}.mapnote{position:absolute;z-index:500;left:14px;top:14px;background:#fff;padding:8px 11px;border-radius:9px;box-shadow:0 2px 10px #0002;font-size:12px}.modalbg{display:none;position:fixed;inset:0;background:#0005;z-index:2000;align-items:center;justify-content:center}.modal{background:#fff;border-radius:12px;padding:17px;width:min(820px,calc(100% - 24px));max-height:92vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px;font-size:11px;color:#666}.full{grid-column:1/-1}.urlbox{display:flex;gap:7px}.urlbox input{flex:1}.urlbox a{padding:8px 10px;border:1px solid #ccc;border-radius:7px;text-decoration:none;color:#222;white-space:nowrap;background:#f7f7f7}.empty{padding:18px;text-align:center;color:#777;font-size:12px}.popupTitle{font-weight:700;font-size:14px;margin-bottom:4px}.popupMeta{font-size:11px;color:#666;line-height:1.45}.popupBtn{display:inline-block;margin-top:7px;padding:5px 8px;border:1px solid #ccc;border-radius:6px;text-decoration:none;color:#222;background:#f7f7f7;font-size:11px}@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:56vh 44vh}.side{min-height:0;grid-row:2}.main{min-height:0;grid-row:1}.mapnote{top:8px;left:8px}}
</style></head><body><div class="app"><aside class="side"><div class="head"><h1>База объектов девелопмента</h1><div class="muted">Общая версия для коллег. Источник данных — Google Таблица.</div><div class="sync" id="sync">Загружаю данные…</div></div><div class="toolbar"><button class="primary" onclick="loadData(true)">↻ Обновить</button><button onclick="openSheet()">↗ Открыть таблицу</button></div><div class="filters"><input id="q" placeholder="Поиск: проект, адрес, метро, агентство…" oninput="render()"><select id="status" onchange="render()"><option value="">Все статусы</option></select><select id="district" onchange="render()"><option value="">Все районы</option></select><select id="decision" onchange="render()"><option value="">Все решения</option></select></div><div id="list" class="list"></div></aside><main class="main"><div id="map" class="map"></div><div class="mapnote">Карта объектов · клик по точке открывает карточку</div></main></div><div id="modal" class="modalbg"><div class="modal"><h2 id="mt" style="margin:0 0 12px">Объект</h2><div id="form" class="grid"></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button onclick="modal.style.display='none'">Закрыть</button></div></div></div>
<script>const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTB07y0UlTuKbTTIEFXMblZx_GVEiXKrVreOVq3n83nX4cpzxFnjNU64T2KSwQ3iQGUr_Y2-2aEFJRY/pub?output=csv';const SHEET_URL='https://docs.google.com/spreadsheets/d/1Bv-VRTjRVrIiXGXC9AJR4JqS1y4VQECxD2BZEpDRUis/edit?usp=sharing';let data=[],cols=[],map,markers=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const col=(...a)=>a.map(x=>cols.find(c=>String(c).trim().toLowerCase()==x.toLowerCase())).find(Boolean)||'';const val=(p,c)=>c?(p[c]??''):'';const nameC=()=>col('Название проекта','Проект','Название'),statusC=()=>col('Статус'),districtC=()=>col('Район'),decisionC=()=>col('Решение'),addrC=()=>col('Адрес'),latC=()=>col('Широта','Latitude','lat'),lonC=()=>col('Долгота','Longitude','lon'),metroC=()=>col('Метро'),idC=()=>col('ID','Id','id');
function initMap(){map=L.map('map').setView([55.751244,37.618423],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}
function renderFilters(){[['status',statusC(),'Все статусы'],['district',districtC(),'Все районы'],['decision',decisionC(),'Все решения']].forEach(([id,c,first])=>{let e=$(id),old=e.value,vs=[...new Set(data.map(p=>String(val(p,c)).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));e.innerHTML='<option value="">'+first+'</option>'+vs.map(v=>'<option>'+esc(v)+'</option>').join('');if(vs.includes(old))e.value=old})}
function rows(){let q=$('q').value.toLowerCase(),s=$('status').value,d=$('district').value,r=$('decision').value;return data.map((p,i)=>({p,i})).filter(({p})=>(!q||cols.map(c=>val(p,c)).join(' ').toLowerCase().includes(q))&&(!s||val(p,statusC())==s)&&(!d||val(p,districtC())==d)&&(!r||val(p,decisionC())==r))}
function render(){renderFilters();let rs=rows();$('list').innerHTML=rs.length?rs.map(({p,i})=>`<div class="card" onclick="openProject(${i});focusProject(${i})"><div class="title">${esc(val(p,nameC())||'Без названия')}${val(p,statusC())?'<span class="badge">'+esc(val(p,statusC()))+'</span>':''}</div><div class="meta">${esc(val(p,addrC()))}${val(p,metroC())?' · м. '+esc(val(p,metroC())):''}</div></div>`).join(''):'<div class="empty">Объектов не найдено</div>';renderMap()}
function renderMap(){markers.forEach(m=>m.remove());markers=[];let rs=rows(),bounds=[];rs.forEach(({p,i})=>{let lat=parseFloat(String(val(p,latC())).replace(',','.')),lon=parseFloat(String(val(p,lonC())).replace(',','.'));if(!Number.isFinite(lat)||!Number.isFinite(lon))return;let n=val(p,nameC())||'Объект',s=val(p,statusC()),addr=val(p,addrC()),pres=val(p,col('Ссылка на презентацию'));let html=`<div class="popupTitle">${esc(n)}</div><div class="popupMeta">${esc(s)}${addr?' · '+esc(addr):''}</div><button class="popupBtn" onclick="openProject(${i})">Подробнее</button>${/^https?:\/\//i.test(String(pres))?`<a class="popupBtn" href="${esc(pres)}" target="_blank" rel="noopener">Презентация</a>`:''}`;let marker=L.marker([lat,lon]).addTo(map).bindPopup(html);markers.push(marker);bounds.push([lat,lon])});if(bounds.length){map.fitBounds(bounds,{padding:[40,40],maxZoom:12})}else if(map){map.setView([55.751244,37.618423],10)}}
function focusProject(i){let p=data[i];if(!p)return;let lat=parseFloat(String(val(p,latC())).replace(',','.')),lon=parseFloat(String(val(p,lonC())).replace(',','.'));if(Number.isFinite(lat)&&Number.isFinite(lon)){map.setView([lat,lon],14);let m=markers.find(x=>{let ll=x.getLatLng();return Math.abs(ll.lat-lat)<1e-8&&Math.abs(ll.lng-lon)<1e-8});if(m)m.openPopup()}}
function openProject(i){let p=data[i];if(!p)return;$('mt').textContent=val(p,nameC())||'Объект';$('form').innerHTML=cols.map(c=>{let v=val(p,c),full=/адрес|ссылка|комментар|следующее действие/i.test(c),url=/^https?:\/\//i.test(String(v)),ctl=url?`<div class="urlbox"><input value="${esc(v)}" readonly><a href="${esc(v)}" target="_blank" rel="noopener">Открыть</a></div>`:/комментар|следующее действие/i.test(c)?`<textarea rows="3" readonly>${esc(v)}</textarea>`:`<input value="${esc(v)}" readonly>`;return `<label class="field ${full?'full':''}">${esc(c)}${ctl}</label>`}).join('');$('modal').style.display='flex'}function openSheet(){window.open(SHEET_URL,'_blank')}
async function loadData(manual=false){try{$('sync').textContent='Обновляю данные…';let u=CSV_URL+'&t='+Date.now(),r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let text=await r.text(),wb=XLSX.read(text,{type:'string',raw:false}),ws=wb.Sheets[wb.SheetNames[0]],rs=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});if(!rs.length)throw Error('В опубликованной таблице пока нет строк.');cols=[];rs.forEach(x=>Object.keys(x).forEach(c=>{if(!cols.includes(c))cols.push(c)}));data=rs.map(x=>{let p={};cols.forEach(c=>p[c]=x[c]??'');return p});render();$('sync').textContent='✓ Обновлено: '+new Date().toLocaleTimeString('ru-RU')+' · объектов: '+data.length}catch(e){$('sync').textContent='Ошибка загрузки: '+e.message;if(manual)alert('Не удалось получить данные из Google Таблицы. Проверь, что публикация включена.')}}initMap();loadData(false);setInterval(()=>loadData(false),60000);</script></body></html>
