<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>База объектов ASPACE</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f4f5f7}.app{min-height:100vh;display:grid;grid-template-columns:470px 1fr}.side{background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;min-height:100vh;z-index:2}.head{padding:16px 18px;border-bottom:1px solid #eee}h1{margin:0 0 6px;font-size:20px}.muted,.small{color:#777;font-size:12px;line-height:1.45}.sync{margin-top:10px;padding:8px 10px;border-radius:8px;background:#f5f7fa;font-size:12px}.toolbar,.filters{padding:9px 14px;border-bottom:1px solid #eee;display:flex;gap:7px;flex-wrap:wrap}.toolbar button{flex:1}button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px}button.primary{background:#222;color:#fff;border-color:#222}input,select,textarea{font:inherit;border:1px solid #ccc;border-radius:7px;padding:8px;background:#fff;width:100%}.filters{display:grid}.list{overflow:auto;padding:8px;flex:1}.card{padding:11px;border:1px solid #e5e5e5;border-radius:9px;margin-bottom:7px;cursor:pointer;background:#fff}.card:hover{background:#fafafa}.title{font-weight:700;font-size:13px}.meta{font-size:11px;color:#666;margin-top:4px;line-height:1.4}.badge{margin-left:5px;padding:2px 6px;border-radius:10px;background:#eee;font-size:10px}.main{position:relative;min-width:0;background:#e5e7eb}.map{position:absolute;inset:0}.mapnote{position:absolute;z-index:10;left:14px;top:14px;background:#fff;padding:8px 11px;border-radius:9px;box-shadow:0 2px 10px #0002;font-size:12px}.modalbg{display:none;position:fixed;inset:0;background:#0005;z-index:2000;align-items:center;justify-content:center}.modal{background:#fff;border-radius:12px;padding:17px;width:min(820px,calc(100% - 24px));max-height:92vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px;font-size:11px;color:#666}.full{grid-column:1/-1}.urlbox{display:flex;gap:7px}.urlbox input{flex:1}.urlbox a{padding:8px 10px;border:1px solid #ccc;border-radius:7px;text-decoration:none;color:#222;white-space:nowrap;background:#f7f7f7}.empty{padding:18px;text-align:center;color:#777;font-size:12px}.mapError{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:#555;background:#eef0f3}.mapErrorBox{max-width:520px;background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 14px #0002}.marker{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 8px #0005;cursor:pointer}.marker>span{display:block;width:6px;height:6px;border-radius:50%;background:#fff;margin:3px}.status-interest{background:#e67e22}.status-study{background:#3498db}.status-new{background:#27ae60}.status-hold{background:#9b59b6}.status-no{background:#777}@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:56vh 44vh}.side{min-height:0;grid-row:2}.main{min-height:0;grid-row:1}.mapnote{top:8px;left:8px}}</style></head><body><div class="app"><aside class="side"><div class="head"><h1>База объектов ASPACE</h1><div class="muted">Общая версия для коллег. Данные — Google Таблица, карта — Яндекс.</div><div class="sync" id="sync">Загружаю данные…</div></div><div class="toolbar"><button class="primary" onclick="refreshAll()">↻ Обновить</button><button onclick="openSheet()">↗ Открыть таблицу</button></div><div class="filters"><input id="q" placeholder="Поиск: проект, адрес, метро, агентство…" oninput="render()"><select id="status" onchange="render()"><option value="">Все статусы</option></select><select id="district" onchange="render()"><option value="">Все районы</option></select><select id="decision" onchange="render()"><option value="">Все решения</option></select></div><div id="list" class="list"></div></aside><main class="main"><div id="map" class="map"></div><div class="mapnote">Яндекс Карты · клик по точке открывает карточку</div></main></div><div id="modal" class="modalbg"><div class="modal"><h2 id="mt" style="margin:0 0 12px">Объект</h2><div id="form" class="grid"></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button onclick="modal.style.display='none'">Закрыть</button></div></div></div><script>const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTB07y0UlTuKbTTIEFXMblZx_GVEiXKrVreOVq3n83nX4cpzxFnjNU64T2KSwQ3iQGUr_Y2-2aEFJRY/pub?output=csv';const SHEET_URL='https://docs.google.com/spreadsheets/d/1Bv-VRTjRVrIiXGXC9AJR4JqS1y4VQECxD2BZEpDRUis/edit?usp=sharing';let data=[],cols=[],map=null,markers=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const col=(...a)=>a.map(x=>cols.find(c=>String(c).trim().toLowerCase()==x.toLowerCase())).find(Boolean)||'';const val=(p,c)=>c?(p[c]??''):'';const nameC=()=>col('Название проекта','Проект','Название'),statusC=()=>col('Статус'),districtC=()=>col('Район'),decisionC=()=>col('Решение'),addrC=()=>col('Адрес'),latC=()=>col('Широта','Latitude','lat'),lonC=()=>col('Долгота','Longitude','lon'),metroC=()=>col('Метро');function markerClass(s){s=String(s).toLowerCase();if(s.includes('интерес'))return'status-interest';if(s.includes('изуч'))return'status-study';if(s.includes('нов'))return'status-new';if(s.includes('отлож'))return'status-hold';return'status-no'}function showMapError(title,msg,button){$('map').innerHTML='<div class="mapError"><div class="mapErrorBox"><b>'+esc(title)+'</b><div style="margin:10px 0 14px;line-height:1.5">'+esc(msg)+'</div>'+(button?'<button onclick="setupYandexKey()">Настроить ключ Яндекс</button>':'')+'</div></div>'}function setupYandexKey(){const old=localStorage.getItem('dev_yandex_key_v3')||'';const key=prompt('Вставьте ваш ключ JavaScript API Яндекс Карт. Ключ сохраняется только в этом браузере и никуда не отправляется.',old);if(key===null)return;if(!key.trim()){localStorage.removeItem('dev_yandex_key_v3');showMapError('Ключ удалён','Для карты нужен активный ключ JavaScript API Яндекс Карт.');return}localStorage.setItem('dev_yandex_key_v3',key.trim());location.reload()}function initYandexScript(){return new Promise((resolve,reject)=>{const key=localStorage.getItem('dev_yandex_key_v3')||'';if(!key){reject(new Error('Не найден ключ Яндекс JS API в этом браузере.'));return}if(window.ymaps3){resolve();return}let done=false;const finish=(fn,arg)=>{if(done)return;done=true;clearTimeout(timer);fn(arg)};const s=document.createElement('script');s.src='https://api-maps.yandex.ru/v3/?apikey='+encodeURIComponent(key)+'&lang=ru_RU';s.onload=()=>finish(resolve);s.onerror=()=>finish(reject,new Error('Браузер не смог загрузить api-maps.yandex.ru. Возможно, мешает VPN/сеть или ограничение HTTP Referer.'));document.head.appendChild(s);const timer=setTimeout(()=>finish(reject,new Error('Яндекс Карты не ответили за 12 секунд. Проверьте VPN/сеть или доступ к api-maps.yandex.ru.')),12000)})}async function initMap(){try{await initYandexScript();await ymaps3.ready;const{YMap,YMapDefaultSchemeLayer,YMapDefaultFeaturesLayer}=ymaps3;map=new YMap($('map'),{location:{center:[37.618423,55.751244],zoom:10},showScaleInCopyrights:true},[new YMapDefaultSchemeLayer({}),new YMapDefaultFeaturesLayer({})]);renderMap()}catch(e){showMapError('Яндекс Карта пока не загрузилась',e.message,!localStorage.getItem('dev_yandex_key_v3'))}}function renderFilters(){[['status',statusC(),'Все статусы'],['district',districtC(),'Все районы'],['decision',decisionC(),'Все решения']].forEach(([id,c,first])=>{let e=$(id),old=e.value,vs=[...new Set(data.map(p=>String(val(p,c)).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));e.innerHTML='<option value="">'+first+'</option>'+vs.map(v=>'<option>'+esc(v)+'</option>').join('');if(vs.includes(old))e.value=old})}function rows(){let q=$('q').value.toLowerCase(),s=$('status').value,d=$('district').value,r=$('decision').value;return data.map((p,i)=>({p,i})).filter(({p})=>(!q||cols.map(c=>val(p,c)).join(' ').toLowerCase().includes(q))&&(!s||val(p,statusC())==s)&&(!d||val(p,districtC())==d)&&(!r||val(p,decisionC())==r)}function render(){renderFilters();let rs=rows();$('list').innerHTML=rs.length?rs.map(({p,i})=>`<div class="card" onclick="openProject(${i});focusProject(${i})"><div class="title">${esc(val(p,nameC())||'Без названия')}${val(p,statusC())?'<span class="badge">'+esc(val(p,statusC()))+'</span>':''}</div><div class="meta">${esc(val(p,addrC()))}${val(p,metroC())?' · м. '+esc(val(p,metroC())):''}</div></div>`).join(''):'<div class="empty">Объектов не найдено</div>';renderMap()}function renderMap(){if(!map)return;markers.forEach(m=>map.removeChild(m));markers=[];let rs=rows(),points=[];rs.forEach(({p,i})=>{let lat=parseFloat(String(val(p,latC())).replace(',','.')),lon=parseFloat(String(val(p,lonC())).replace(',','.'));if(!Number.isFinite(lat)||!Number.isFinite(lon))return;let el=document.createElement('div');el.className='marker '+markerClass(val(p,statusC()));el.title=val(p,nameC())||'Объект';el.innerHTML='<span></span>';el.addEventListener('click',ev=>{ev.stopPropagation();openProject(i);map.setLocation({center:[lon,lat],zoom:14,duration:250})});let marker=new ymaps3.YMapMarker({coordinates:[lon,lat],zIndex:100},el);map.addChild(marker);markers.push(marker);points.push([lon,lat])});if(points.length===1)map.setLocation({center:points[0],zoom:13});else if(points.length>1){let minLon=Math.min(...points.map(x=>x[0])),maxLon=Math.max(...points.map(x=>x[0])),minLat=Math.min(...points.map(x=>x[1])),maxLat=Math.max(...points.map(x=>x[1]));map.setLocation({bounds:[[minLon,minLat],[maxLon,maxLat]],duration:250})}else map.setLocation({center:[37.618423,55.751244],zoom:10})}function focusProject(i){let p=data[i];if(!p||!map)return;let lat=parseFloat(String(val(p,latC())).replace(',','.')),lon=parseFloat(String(val(p,lonC())).replace(',','.'));if(Number.isFinite(lat)&&Number.isFinite(lon))map.setLocation({center:[lon,lat],zoom:14,duration:250})}function openProject(i){let p=data[i];if(!p)return;$('mt').textContent=val(p,nameC())||'Объект';$('form').innerHTML=cols.map(c=>{let v=val(p,c),full=/адрес|ссылка|комментар|следующее действие/i.test(c),url=/^https?:\/\//i.test(String(v)),ctl=url?`<div class="urlbox"><input value="${esc(v)}" readonly><a href="${esc(v)}" target="_blank" rel="noopener">Открыть</a></div>`:/комментар|следующее действие/i.test(c)?`<textarea rows="3" readonly>${esc(v)}</textarea>`:`<input value="${esc(v)}" readonly>`;return `<label class="field ${full?'full':''}">${esc(c)}${ctl}</label>`}).join('');$('modal').style.display='flex'}function openSheet(){window.open(SHEET_URL,'_blank')}async function loadData(manual=false){try{$('sync').textContent='Обновляю данные…';let u=CSV_URL+'&t='+Date.now(),r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let text=await r.text(),wb=XLSX.read(text,{type:'string',raw:false}),ws=wb.Sheets[wb.SheetNames[0]],rs=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});if(!rs.length)throw Error('В опубликованной таблице пока нет строк.');cols=[];rs.forEach(x=>Object.keys(x).forEach(c=>{if(!cols.includes(c))cols.push(c)}));data=rs.map(x=>{let p={};cols.forEach(c=>p[c]=x[c]??'');return p});render();$('sync').textContent='✓ Обновлено: '+new Date().toLocaleTimeString('ru-RU')+' · объектов: '+data.length}catch(e){$('sync').textContent='Ошибка загрузки: '+e.message;if(manual)alert('Не удалось получить данные из Google Таблицы. Проверьте, что публикация включена.')}}async function refreshAll(){$('sync').textContent='Обновляю данные и карту…';await loadData(true);if(map){renderMap()}else{await initMap()}}(async()=>{loadData(false);initMap();setInterval(()=>loadData(false),60000)})();</script></body></html>
