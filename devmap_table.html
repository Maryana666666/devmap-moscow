function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function num(v){if(v===null||v==="")return "";let n=Number(v);return isFinite(n)?new Intl.NumberFormat("ru-RU").format(n):String(v)}

function updateMap(){if(!map||!window.YMapMarker)return;markers.forEach(m=>{try{map.removeChild(m)}catch(e){}});markers=[];projects.forEach(x=>{let lat=Number(x["Широта"]),lon=Number(x["Долгота"]);if(!isFinite(lat)||!isFinite(lon))return;let color=x["Статус"]==="Отказ"?"#777":x["Статус"]==="Интересно"?"#e53935":x["Статус"]==="Изучаем"?"#f9a825":x["Статус"]==="Отложен"?"#8e24aa":"#1e88e5";const el=document.createElement("div");el.style.cssText="width:18px;height:18px;border-radius:50%;background:"+color+";border:3px solid white;box-shadow:0 1px 5px #0006;cursor:pointer";el.title=x["Название проекта"]||"";el.onclick=()=>editProject(x.ID);const m=new YMapMarker({coordinates:[lon,lat]},el);map.addChild(m);markers.push(m)})}
