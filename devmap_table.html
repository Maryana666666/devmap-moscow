<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Девелопмент Москва — карта объектов</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#202124;background:#f4f5f7}.app{height:100vh;display:grid;grid-template-columns:470px 1fr}.side{background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;min-width:0}.head{padding:16px 18px;border-bottom:1px solid #eee}h1{margin:0 0 4px;font-size:20px}.muted{color:#777;font-size:12px}.toolbar{padding:10px 14px;border-bottom:1px solid #eee;display:flex;gap:7px;flex-wrap:wrap}button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px}button.primary{background:#222;color:#fff;border-color:#222}.filters{padding:9px 14px;border-bottom:1px solid #eee;display:grid;gap:6px}input,select,textarea{font:inherit;border:1px solid #ccc;border-radius:7px;padding:8px;background:#fff;width:100%}.list{overflow:auto;padding:8px}.card{padding:11px;border:1px solid #e5e5e5;border-radius:9px;margin-bottom:7px;cursor:pointer}.card:hover{background:#fafafa}.title{font-weight:700;font-size:13px}.meta{font-size:11px;color:#666;line-height:1.45;margin-top:4px}.badge{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:10px;background:#eee;font-size:10px}.map{position:relative}#map{height:100%;width:100%}.maphelp{position:absolute;left:14px;top:14px;background:#fff;border-radius:8px;padding:9px 11px;box-shadow:0 2px 12px #0002;z-index:5;font-size:12px;max-width:340px}.modalbg{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:center;justify-content:center}.modal{background:#fff;border-radius:12px;padding:17px;width:min(720px,calc(100% - 24px));max-height:92vh;overflow:auto;box-shadow:0 10px 40px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px;font-size:11px;color:#666}.full{grid-column:1/-1}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.right{display:flex;gap:7px}.danger{color:#b42318}.small{font-size:11px;color:#777}.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.links a{font-size:11px;text-decoration:none;border:1px solid #ddd;border-radius:7px;padding:5px 7px;color:#333}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:56vh}.map{height:44vh}}</style></head><body><div class="app"><aside class="side"><div class="head"><h1>База объектов девелопмента</h1><div class="muted">Карта построена по вашей таблице «Зем.участки_объекты»</div></div><div class="toolbar"><button class="primary" onclick="newProject()">＋ Новый объект</button><button onclick="openBase()">↗ Открыть общую базу</button><button onclick="openSettings()">⚙ Настройки карты</button></div><div class="filters"><input id="q" placeholder="Поиск: проект, адрес, метро, агентство…" oninput="render()"><select id="status" onchange="render()"><option value="">Все статусы</option></select><select id="district" onchange="render()"><option value="">Все районы</option></select><select id="decision" onchange="render()"><option value="">Все решения</option></select></div><div id="list" class="list"></div></aside><main class="map"><div id="map"></div><div class="maphelp" id="maphelp">Карта загружается…</div></main></div><div class="modalbg" id="modal"><div class="modal"><h2 id="modalTitle" style="margin:0 0 12px">Объект</h2><div class="grid" id="form"></div><div class="actions"><button class="danger" id="deleteBtn" onclick="deleteCurrent()">Удалить</button><div class="right"><button onclick="closeModal()">Отмена</button><button class="primary" onclick="saveCurrent()">Сохранить</button></div></div></div></div><div class="modalbg" id="settings"><div class="modal"><h2 style="margin:0 0 8px">Настройки карты</h2><div class="small">Ключ Яндекс JS API хранится только в этом браузере.</div><label class="field" style="margin-top:12px">Ключ JS API<input id="apiKeyInput" type="password"></label><div class="actions"><span></span><div class="right"><button onclick="closeSettings()">Отмена</button><button class="primary" onclick="saveKey()">Сохранить</button></div></div></div></div><script>const BASE_URL="https://disk.360.yandex.ru/i/9lVnEpyq1YIWTw";const YANDEX_API_KEY="";const LABELS=["ID","Дата поступления","Название проекта","Тип объекта","Статус","Адрес","Район","Метро","Широта","Долгота","Площадь участка, м²","Площадь застройки, м²"," площадь ГНС, м²","Продаваемая площадь, м²","Цена, ₽","Цена за м², ₽","Источник / агентство","Контакт","Телефон","Ссылка на презентацию","Ссылка на папку","Следующее действие","Ответственный","Дата следующего действия","Комментарий","Решение"];let projects=[],currentId=null,map=null,markers=[];function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function val(x,k){return x[k]??""}function persist(){localStorage.setItem("dev_projects_table_v1",JSON.stringify(projects))}function money(v){if(v===null||v==="")return "";let n=Number(v);return isFinite(n)?new Intl.NumberFormat("ru-RU").format(n)+" ₽":String(v)}function num(v){if(v===null||v==="")return "";let n=Number(v);return isFinite(n)?new Intl.NumberFormat("ru-RU").format(n):String(v)}function openBase(){window.open(BASE_URL,"_blank")}function populateFilters(){const add=(id,arr,word)=>{const el=document.getElementById(id),old=el.value;el.innerHTML='<option value="">Все '+word+'</option>'+arr.filter(Boolean).sort().map(v=>'<option>'+esc(v)+'</option>').join("");el.value=old};add("status",[...new Set(projects.map(x=>x["Статус"]))],"статусы");add("district",[...new Set(projects.map(x=>x["Район"]))],"районы");add("decision",[...new Set(projects.map(x=>x["Решение"]))],"решения")}function render(){const q=(document.getElementById("q").value||"").toLowerCase(),s=document.getElementById("status").value,d=document.getElementById("district").value,de=document.getElementById("decision").value;const rows=projects.filter(x=>{const text=[x["Название проекта"],x["Адрес"],x["Метро"],x["Тип объекта"],x["Источник / агентство"],x["Контакт"],x["Ответственный"],x["Комментарий"]].join(" ").toLowerCase();return(!q||text.includes(q))&&(!s||x["Статус"]===s)&&(!d||x["Район"]===d)&&(!de||x["Решение"]===de)});document.getElementById("list").innerHTML=rows.length?rows.map(x=>`<div class="card" onclick="editProject(${x.ID})"><div class="title">${esc(x["Название проекта"])} <span class="badge">${esc(x["Статус"])}</span></div><div class="meta">${esc(x["Тип объекта"])} · ${esc(x["Район"])} · ${esc(x["Метро"])}<br>${esc(x["Адрес"])}<br>Участок: ${num(x["Площадь участка, м²"])} м² · Продажи: ${num(x["Продаваемая площадь, м²"])} м² · Цена: ${money(x["Цена, ₽"])}</div><div class="links">${x["Ссылка на презентацию"]?`<a href="${esc(x["Ссылка на презентацию"])}" target="_blank" onclick="event.stopPropagation()">Презентация</a>`:""}${x["Ссылка на папку"]?`<a href="${esc(x["Ссылка на папку"])}" target="_blank" onclick="event.stopPropagation()">Папка</a>`:""}</div></div>`).join(""):'<div style="padding:20px;color:#777">Ничего не найдено</div>';updateMap()}function buildForm(x){document.getElementById("form").innerHTML=LABELS.map((k,i)=>{let type=["Широта","Долгота","Площадь участка, м²","Площадь застройки, м²"," площадь ГНС, м²","Продаваемая площадь, м²","Цена, ₽","Цена за м², ₽"].includes(k)?"number":"text";let cls=["Комментарий","Ссылка на презентацию","Ссылка на папку"].includes(k)?"full":"";let tag=k==="Комментарий"?"textarea":"input";return `<label class="field ${cls}">${esc(k)}<${tag} id="f_${i}"${type==="number"?' step="any"':''}>${tag==="textarea"?esc(val(x,k)):""}</${tag}></label>`}).join("");LABELS.forEach((k,i)=>{if(k!=="Комментарий")document.getElementById("f_"+i).value=val(x,k)})}function newProject(){currentId=null;buildForm({});document.getElementById("modalTitle").textContent="Новый объект";document.getElementById("deleteBtn").style.display="none";document.getElementById("modal").style.display="flex"}function editProject(id){const x=projects.find(a=>Number(a.ID)===Number(id));if(!x)return;currentId=id;buildForm(x);document.getElementById("modalTitle").textContent="Объект №"+id;document.getElementById("deleteBtn").style.display="block";document.getElementById("modal").style.display="flex"}function saveCurrent(){const x={};LABELS.forEach((k,i)=>{let v=document.getElementById("f_"+i).value;if(["Широта","Долгота","Площадь участка, м²","Площадь застройки, м²"," площадь ГНС, м²","Продаваемая площадь, м²","Цена, ₽","Цена за м², ₽"].includes(k)&&v!=="")v=Number(v);x[k]=v});if(!x.ID)x.ID=currentId||Math.max(0,...projects.map(a=>Number(a.ID)||0))+1;if(currentId)projects=projects.map(a=>Number(a.ID)===Number(currentId)?x:a);else projects.push(x);persist();closeModal();populateFilters();render()}function deleteCurrent(){if(!currentId)return;if(confirm("Удалить объект из локальной версии карты?")){projects=projects.filter(a=>Number(a.ID)!==Number(currentId));persist();closeModal();populateFilters();render()}}function closeModal(){document.getElementById("modal").style.display="none"}function openSettings(){document.getElementById("apiKeyInput").value=localStorage.getItem("dev_yandex_key_v3")||YANDEX_API_KEY;document.getElementById("settings").style.display="flex"}function closeSettings(){document.getElementById("settings").style.display="none"}function saveKey(){localStorage.setItem("dev_yandex_key_v3",document.getElementById("apiKeyInput").value.trim());closeSettings();loadYandex()}let ymapsLoading=null;function showMapMessage(t){document.getElementById("maphelp").textContent=t;document.getElementById("maphelp").style.display="block"}async function loadYandex(){const key=localStorage.getItem("dev_yandex_key_v3")||YANDEX_API_KEY;if(!key){showMapMessage("Откройте «Настройки карты» и вставьте ключ JavaScript API.");return}if(window.ymaps3){await ymaps3.ready;createMap();return}if(ymapsLoading){await ymapsLoading;return}ymapsLoading=new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://api-maps.yandex.ru/v3/?apikey="+encodeURIComponent(key)+"&lang=ru_RU";s.async=true;s.onload=()=>resolve();s.onerror=()=>reject();document.head.appendChild(s)});try{await ymapsLoading;await ymaps3.ready;createMap()}catch(e){showMapMessage("Ошибка загрузки Яндекс API. Проверьте ключ и интернет.")}}async function createMap(){const {YMap,YMapDefaultSchemeLayer,YMapDefaultFeaturesLayer,YMapMarker}=ymaps3;map=new YMap(document.getElementById("map"),{location:{center:[37.60,55.73],zoom:9.7}});map.addChild(new YMapDefaultSchemeLayer());try{map.addChild(new YMapDefaultFeaturesLayer())}catch(e){}window.YMapMarker=YMapMarker;document.getElementById("maphelp").style.display="none";updateMap()}function updateMap(){if(!map||!window.YMapMarker)return;markers.forEach(m=>{try{map.removeChild(m)}catch(e){}});markers=[];projects.forEach(x=>{let lat=Number(x["Широта"]),lon=Number(x["Долгота"]);if(!isFinite(lat)||!isFinite(lon))return;let color=x["Статус"]==="Отказ"?"#777":x["Статус"]==="Интересно"?"#e53935":x["Статус"]==="Изучаем"?"#f9a825":x["Статус"]==="Отложен"?"#8e24aa":"#1e88e5";const el=document.createElement("div");el.style.cssText="width:18px;height:18px;border-radius:50%;background:"+color+";border:3px solid white;box-shadow:0 1px 5px #0006;cursor:pointer";el.title=x["Название проекта"]||"";el.onclick=()=>editProject(x.ID);const m=new YMapMarker({coordinates:[lon,lat]},el);map.addChild(m);markers.push(m)})}async function start(){try{const r=await fetch("data.json?"+Date.now());projects=await r.json()}catch(e){projects=JSON.parse(localStorage.getItem("dev_projects_table_v1")||"null")||[]}populateFilters();render();loadYandex()}start();</script></body></html>
