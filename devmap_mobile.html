<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>База объектов ASPACE</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="devmap_google.html" title="База объектов ASPACE"></iframe>
<script>
const css=`
html,body{overflow-x:hidden!important}
body{overflow-y:auto!important;-webkit-overflow-scrolling:touch!important}
.app{display:flex!important;flex-direction:column!important;min-height:100vh!important}
.main{order:1!important;height:38vh!important;min-height:300px!important;max-height:430px!important;flex:none!important}
.side{order:2!important;min-height:0!important;display:block!important;border-right:0!important}
.head{padding:14px 16px!important}.head h1{font-size:24px!important}
.toolbar{padding:10px 14px!important}.toolbar button{min-height:44px!important;font-size:15px!important}
.filters{padding:10px 14px!important;gap:9px!important}.filters input,.filters select{min-height:46px!important;font-size:16px!important}
.list{overflow:visible!important;padding:10px 14px 30px!important;display:block!important}
.card{padding:14px!important;margin-bottom:10px!important;min-height:72px!important}.title{font-size:15px!important}.meta{font-size:13px!important;margin-top:6px!important}
.mapnote{left:10px!important;top:10px!important;font-size:11px!important;padding:7px 9px!important}
.modal{width:calc(100% - 16px)!important;max-height:88vh!important;padding:14px!important}.grid{grid-template-columns:1fr!important}.full{grid-column:auto!important}
@media(max-width:420px){.main{height:34vh!important;min-height:260px!important}.head h1{font-size:22px!important}.muted{font-size:12px!important}.toolbar button{font-size:14px!important}.list{padding-left:12px!important;padding-right:12px!important}}
`;
function patch(){
  const f=document.getElementById('app');
  try{
    const d=f.contentDocument;
    if(!d)return;
    if(!d.getElementById('mobile-fix')){const s=d.createElement('style');s.id='mobile-fix';s.textContent=css;d.head.appendChild(s);}
  }catch(e){}
}
document.getElementById('app').addEventListener('load',patch);
setTimeout(patch,500);
</script>
</body>
</html>
