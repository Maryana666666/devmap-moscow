name: Patch map UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix map zoom and labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('responsive_nokey.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(".marker span{position:absolute;transform:rotate(45deg);left:30px;top:-4px;", ".marker span{position:absolute;transform:translate(-50%,-100%);left:50%;top:-8px;")
          s=s.replace("function mapSrc(){return 'https://yandex.ru/map-widget/v1/?ll='+encodeURIComponent(centerLon+','+centerLat)+'&z='+zoom+'&lang=ru_RU&l=map'}", "function mapSrc(){return 'https://yandex.ru/map-widget/v1/?ll='+encodeURIComponent(centerLon+','+centerLat)+'&z='+zoom+'&lang=ru_RU&l=map&v='+Date.now()}")
          s=s.replace("function zoomMap(d){zoom=Math.max(8,Math.min(17,zoom+d));draw()}", "function zoomMap(d){zoom=Math.max(8,Math.min(17,zoom+d));draw()}")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add responsive_nokey.html
          git rm .github/workflows/patch-map-ui.yml
          git commit -m "Fix map zoom and labels"
          git push
