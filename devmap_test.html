<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>База объектов ASPACE — тест карты</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}.top{background:#111827;color:#fff;padding:16px 20px}.top h1{margin:0 0 5px;font-size:22px}.top .sub{opacity:.75;font-size:13px}.wrap{max-width:1400px;margin:auto;padding:14px}.status{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;box-shadow:0 1px 5px #0001}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters input,.filters select{border:1px solid #d1d5db;border-radius:9px;padding:9px 11px;background:#fff;font-size:14px}.layout{display:grid;grid-template-columns:420px 1fr;gap:12px}.list{display:flex;flex-direction:column;gap:10px}.card{background:#fff;border-radius:12px;padding:13px;box-shadow:0 1px 5px #0001;cursor:pointer}.name{font-weight:700;font-size:16px;margin-bottom:7px}.meta{font-size:13px;line-height:1.5;color:#4b5563}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff;font-size:11px;margin-bottom:7px}.mapbox{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 5px #0001;min-height:620px}.mapbox iframe{width:100%;height:620px;border:0;display:block}.note{padding:10px 12px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:10px;margin-bottom:12px;font-size:13px}.empty{padding:30px;text-align:center;color:#6b7280;background:#fff;border-radius:12px}.coords{font-size:12px;color:#6b7280;margin-top:5px}@media(max-width:900px){.layout{grid-template-columns:1fr}.mapbox{min-height:430px}.mapbox iframe{height:430px}}</style></head>
<body><header class="top"><h1>База объектов ASPACE</h1><div class="sub">Тестовая версия: автоматические метки из Google Таблицы</div></header><div class="wrap">
<div id="status" class="status">Загрузка данных…</div><div class="note">Тестовая версия. Метки строятся автоматически из колонок «Широта» и «Долгота» Google Таблицы. Основную страницу не меняем.</div>
<div class="filters"><input id="search" placeholder="Поиск по объектам…"><select id="statusFilter"><option value="">Все статусы</option></select><select id="districtFilter"><option value="">Все районы</option></select></div>
<div class="layout"><section id="list" class="list"><div class="empty">Загрузка объектов…</div></section><section class="mapbox"><iframe id="mapFrame" title="Яндекс Карты" src="https://yandex.ru/map-widget/v1/?ll=37.6047%2C55.7572&z=11&pt=37.623277,55.773044,pm2rdm~37.58614,55.741404,pm2rdm&lang=ru_RU" allowfullscreen></iframe></section></div></div>
<script>
const CSV_PUB='https://docs.google.com/spreadsheets/d/e/2PACX-1vTB07y0UlTuKbTTIEFXMblZx_GVEiXKrVreOVq3n83nX4cpzxFnjNU64T2KSwQ3iQGUr_Y2-2aEFJRY/pub?output=csv';
const CSV_GVIZ='https://docs.google.com/spreadsheets/d/1Bv-VRTjRVrIiXGXC9AJR4JqS1y4VQECxD2BZEpDRUis/gviz/tq?tqx=out:csv&gid=0';
let rows=[];
function parseCSV(text){const out=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v.trim()))out.push(row);row=[]}else cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(v=>v.trim()))out.push(row)}return out}
const clean=v=>String(v??'').trim();function val(o,n){for(const k of n)if(o[k])return o[k];return ''}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function getCsv(){for(const base of [CSV_PUB,CSV_GVIZ]){try{const u=base+(base.includes('?')?'&':'?')+'_t='+Date.now();const r=await fetch(u,{cache:'no-store'});if(r.ok){const t=await r.text();if(t&&t.length>20)return t}}catch(e){}}throw new Error('Не удалось загрузить Google Таблицу')}
function buildMapUrl(data){const pts=data.map(o=>{const lat=Number(val(o,['Широта','lat'])),lon=Number(val(o,['Долгота','lon']));return Number.isFinite(lat)&&Number.isFinite(lon)?lon+','+lat+',pm2rdm':''}).filter(Boolean);if(!pts.length)return null;return 'https://yandex.ru/map-widget/v1/?ll=37.6047%2C55.7572&z=11&pt='+pts.join('~')+'&lang=ru_RU'}
function updateMap(data){const u=buildMapUrl(data);if(u)document.getElementById('mapFrame').src=u}
function renderFilters(){const statuses=[...new Set(rows.map(o=>val(o,['Статус'])).filter(Boolean))].sort(),districts=[...new Set(rows.map(o=>val(o,['Район'])).filter(Boolean))].sort();for(const [id,a,lab] of [['statusFilter',statuses,'Все статусы'],['districtFilter',districts,'Все районы']])document.getElementById(id).innerHTML='<option value="">'+lab+'</option>'+a.map(x=>'<option>'+esc(x)+'</option>').join('')}
function render(){const q=clean(search.value).toLowerCase(),sf=statusFilter.value,df=districtFilter.value;const data=rows.filter(o=>{const b=Object.values(o).join(' ').toLowerCase();return(!q||b.includes(q))&&(!sf||val(o,['Статус'])===sf)&&(!df||val(o,['Район'])===df)});list.innerHTML=data.length?data.map(o=>{const name=val(o,['Название проекта','Название','Проект'])||'Без названия',status=val(o,['Статус'])||'—',addr=val(o,['Адрес'])||'—',metro=val(o,['Метро']),district=val(o,['Район']),lat=val(o,['Широта','lat']),lon=val(o,['Долгота','lon']);return '<article class="card"><div class="badge">'+esc(status)+'</div><div class="name">'+esc(name)+'</div><div class="meta">'+esc(addr)+(district?' · '+esc(district):'')+(metro?' · м. '+esc(metro):'')+'</div>'+(lat&&lon?'<div class="coords">Координаты: '+esc(lat)+', '+esc(lon)+'</div>':'')+'</article>'}).join(''):'<div class="empty">Ничего не найдено</div>';updateMap(data)}
async function load(){try{const a=parseCSV(await getCsv());if(!a.length)throw Error('Google Таблица вернула пустой файл');const h=a[0].map(clean);rows=a.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=clean(r[i]));return o}).filter(o=>Object.values(o).some(Boolean));renderFilters();render();status.textContent='✓ Данные загружены · объектов: '+rows.length+' · метки из координат таблицы'}catch(e){status.textContent='⚠ '+e.message;list.innerHTML='<div class="empty">Не удалось загрузить данные. Попробуйте обновить страницу.</div>'}}
search.addEventListener('input',render);statusFilter.addEventListener('change',render);districtFilter.addEventListener('change',render);load();setInterval(load,60000);
</script></body></html>
